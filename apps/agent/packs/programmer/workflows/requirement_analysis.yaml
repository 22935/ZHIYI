{
  "workflowId": "programmer_requirement_analysis_v1",
  "name": "Programmer Requirement Analysis Workflow",
  "domain": "programmer",
  "intent": "requirement_analysis",
  "version": "1.0.1",
  "description": "Programmer workflow for requirement analysis, code search, code generation, and Mermaid diagrams.",
  "runtimeEngine": "acg",
  "planningNodes": [
    {"key": "step:task_understanding", "title": "Task Understanding", "objective": "Identify the task goal and constraints before requirement analysis", "capabilityRequirements": ["task_understanding"]},
    {"key": "step:requirement_analysis", "title": "Requirement Analysis", "objective": "Translate the request into an implementable technical specification", "capabilityRequirements": ["requirement_analysis"]},
    {"key": "step:codebase_semantic_search", "title": "Codebase Evidence", "objective": "Locate relevant implementation evidence in the codebase", "capabilityRequirements": ["codebase_semantic_search"]},
    {"key": "step:code_generation", "title": "Implementation", "objective": "Produce code that satisfies the technical specification", "capabilityRequirements": ["code_generation"]},
    {"key": "step:diagram_generation", "title": "Architecture Diagram", "objective": "Document the resulting design and interaction sequence", "capabilityRequirements": ["diagram_generation"]}
  ],
  "planningRelations": [
    {"sourceKey": "step:task_understanding", "targetKey": "step:requirement_analysis", "relationType": "depends_on"},
    {"sourceKey": "step:requirement_analysis", "targetKey": "step:codebase_semantic_search", "relationType": "depends_on"},
    {"sourceKey": "step:codebase_semantic_search", "targetKey": "step:code_generation", "relationType": "depends_on"},
    {"sourceKey": "step:code_generation", "targetKey": "step:diagram_generation", "relationType": "depends_on"}
  ],
  "steps": [
    {"stepId": "task_understanding", "name": "Task Understanding", "agentName": "native_general_agent", "capability": "task_understanding", "outputSpec": {"type": "object", "required": ["task_summary"], "properties": {"task_summary": {"type": "object"}}}, "nextStepId": "requirement_analysis"},
    {
      "stepId": "requirement_analysis",
      "name": "Requirement Analysis",
      "agentName": "requirement_analysis",
      "capability": "requirement_analysis",
      "input": {
        "memoryPolicy": {
          "policyId": "programmer-requirement-v1",
          "read": false,
          "write": true,
          "writeType": "episodic",
          "requireAudit": true
        }
      },
      "outputSpec": {
        "type": "object",
        "required": ["technical_spec", "final_answer"],
        "properties": {
          "technical_spec": {"type": "object"},
          "final_answer": {"type": "string"}
        }
      },
      "nextStepId": "codebase_semantic_search"
    },
    {
      "stepId": "codebase_semantic_search",
      "name": "Codebase Semantic Search",
      "agentName": "codebase_search",
      "capability": "codebase_semantic_search",
      "input": {
        "from": {"requirement_analysis": ["technical_spec"]},
        "memoryPolicy": {
          "policyId": "programmer-code-evidence-v1",
          "read": false,
          "write": true,
          "writeType": "evidence",
          "requireAudit": true
        }
      },
      "outputSpec": {
        "type": "object",
        "required": ["query", "hits", "index_status", "sources", "evidence_refs"],
        "properties": {
          "query": {"type": "string"},
          "top_k": {"type": "integer"},
          "hits": {"type": "array"},
          "index_status": {"type": "object"},
          "source_query": {"type": "string"},
          "sources": {"type": "array"},
          "evidence_refs": {"type": "array"}
        }
      },
      "nextStepId": "code_generation"
    },
    {
      "stepId": "code_generation",
      "name": "Code Generation",
      "agentName": "code_generation",
      "capability": "code_generation",
      "input": {
        "from": {
          "requirement_analysis": ["technical_spec"],
          "codebase_semantic_search": ["hits", "evidence_refs"]
        },
        "memoryPolicy": {
          "policyId": "programmer-code-v1",
          "read": false,
          "write": true,
          "writeType": "procedural",
          "requireAudit": true
        }
      },
      "outputSpec": {
        "type": "object",
        "required": ["target_language", "code", "explanation", "suggested_tests", "context_refs"],
        "properties": {
          "target_language": {"type": "string"},
          "code": {"type": "string"},
          "explanation": {"type": "string"},
          "suggested_tests": {"type": "array"},
          "context_refs": {"type": "array"}
        }
      },
      "nextStepId": "diagram_generation"
    },
    {
      "stepId": "diagram_generation",
      "name": "Diagram Generation",
      "agentName": "diagram_generation",
      "capability": "diagram_generation",
      "input": {
        "from": {"code_generation": ["target_language", "context_refs"]},
        "memoryPolicy": {
          "policyId": "programmer-diagram-v1",
          "read": false,
          "write": true,
          "writeType": "procedural",
          "requireAudit": true
        }
      },
      "outputSpec": {
        "type": "object",
        "required": ["title", "diagram_type", "mermaid_code", "sequence_mermaid_code"],
        "properties": {
          "title": {"type": "string"},
          "diagram_type": {"type": "string"},
          "mermaid_code": {"type": "string"},
          "sequence_mermaid_code": {"type": "string"},
          "source_query": {"type": "string"}
        }
      }
    }
  ]
}
