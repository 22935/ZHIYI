<svg xmlns="http://www.w3.org/2000/svg" width="132" height="121" viewBox="0 0 132 121" role="img" aria-labelledby="brandTitle brandDesc">
  <title id="brandTitle">知弈 AgentOS</title>
  <desc id="brandDesc">深色圆角方章内的白色线描标识：中竖、三层对称枝干、门内双眉与左右双拱。</desc>
  <style>
    .plate { fill: #0B0F16; }
    .ink { fill: none; stroke: #F3F3F4; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .ink-fine { fill: none; stroke: #F3F3F4; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .tip { fill: #F3F3F4; }
  </style>

  <rect class="plate" x="5" y="1" width="122" height="115" rx="22" />

  <!-- 中竖，顶部以笔锋收尖 -->
  <path class="ink" d="M66 17 V45" />
  <path class="tip" d="M63.3 21 L66 12.8 L68.7 21 Z" />

  <!-- 第一层：横展长枝 -->
  <path class="ink" d="M66 26 C57 27.5 47.5 30 38 33" />
  <path class="ink" d="M66 26 C75 27.5 84.5 30 95 33" />

  <!-- 第二层：短斜枝 -->
  <path class="ink-fine" d="M59 34 C52 38.5 45 44 39.5 50" />
  <path class="ink-fine" d="M73 34 C80 38.5 87 44 92.5 50" />

  <!-- 第三层：下展长枝 -->
  <path class="ink" d="M66 45 C56 50 44.5 58 38 66" />
  <path class="ink" d="M66 45 C76 50 87.5 58 94 66" />

  <!-- 门内双眉 -->
  <path class="ink-fine" d="M52 72 C56 68.5 59 67.5 62 69" />
  <path class="ink-fine" d="M70 69 C73 67.5 76 68.5 80 72" />

  <!-- 双拱：左收竖笔，右出长撇 -->
  <path class="ink" d="M62 60 C53 58.5 47.5 61.5 47 68 C46.2 78 46.2 88 47 95" />
  <path class="ink" d="M70 60 C79 58.5 84.5 61.5 85 68 C87 78 88 84 88 89 C91 97 94 100 97 102" />
</svg>
